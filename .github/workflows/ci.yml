name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilégio: o workflow só lê o código (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      # O uv.lock tem de corresponder ao pyproject.toml (falha se alguém mudar
      # dependências sem atualizar o lockfile).
      - run: uv lock --check
      # Com o extra `pdf`, o mypy também verifica o caminho de extração de PDFs.
      - run: python -m pip install -e ".[dev,pdf]"
      - run: ruff check moodle_mcp tests
      - run: ruff format --check moodle_mcp tests
      - run: mypy moodle_mcp

  test:
    # O handler, as permissões de ficheiros e os nomes de ficheiro têm caminhos
    # próprios de cada sistema operativo: só uma matriz os exercita.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,pdf]"
      - run: python -m pytest -q tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[pdf]" pip-audit
      # Falha se alguma dependência instalada tiver uma vulnerabilidade conhecida.
      - run: pip-audit --skip-editable
