name: Release

# Publica no PyPI quando é enviada uma tag vX.Y.Z que coincide com a versão do
# pyproject.toml. Usa *trusted publishing* (OIDC): não há nenhum token do PyPI
# guardado no repositório, e o pypa/gh-action-pypi-publish gera atestações de
# proveniência (PEP 740) para cada ficheiro publicado.
#
# Configuração única no PyPI: Your projects → Publishing → Add a pending
# publisher (owner CarlosAndreFerreira, repositório moodle-obsidian-mcp,
# workflow release.yml, ambiente pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A tag tem de coincidir com a versão
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versão v$version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
