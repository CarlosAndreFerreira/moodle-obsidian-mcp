[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodle-obsidian-mcp"
version = "0.8.1"
description = "MCP server for Moodle with server-side prompt-injection defenses, SSO login and Obsidian vault sync"
readme = "README.md"
# tomllib é stdlib a partir do 3.11 e é o que lê o config.toml sem dependências.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos André Ferreira" }]
keywords = ["mcp", "mcp-server", "moodle", "obsidian", "model-context-protocol", "llm", "sso", "prompt-injection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Education :: Computer Aided Instruction (CAI)",
]
dependencies = [
  "mcp>=1.9.0,<2.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.13.0",
  "platformdirs>=4.0.0",
]

[project.optional-dependencies]
# O PyMuPDF é AGPL-3.0 e é viral: fica como extra para que instalar o servidor
# não imponha a licença a quem não precise da extração de texto de PDFs.
# Limitado à série 1.x: a 2.x (out. 2026) passou a depender do onnxruntime,
# numpy e pymupdf4llm (~250 MB a mais), que este projeto não usa — só chama
# get_text(). A 1.x continua mantida; rever quando a 2.x amadurecer.
pdf = ["pymupdf>=1.24.0,<2"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100"]

[project.scripts]
moodle-mcp = "moodle_mcp.server:main"
# Com o nome do pacote, para `uvx moodle-obsidian-mcp` (é o que os clientes do MCP Registry correm).
moodle-obsidian-mcp = "moodle_mcp.server:main"
moodle-mcp-token-catcher = "moodle_mcp.token_catcher:cli"

[project.urls]
Homepage = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp"
Repository = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp"
Documentation = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp#readme"
Issues = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp/issues"
Changelog = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/CarlosAndreFerreira/moodle-obsidian-mcp/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["moodle_mcp"]

# Lista explícita do que entra no sdist. O hatchling segue o .gitignore mas não
# o .git/info/exclude, e sem esta lista um `uv build` local publicava notas
# locais (p.ex. relatórios de segurança por divulgar) e caches de testes.
[tool.hatch.build.targets.sdist]
include = [
  "moodle_mcp",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "server.json",
  "LICENSE",
  ".env.example",
  "main.py",
  "capture_mobile_token.py",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# As docstrings do server.py são anteriores a esta configuração e não seguem
# ainda o estilo Google por completo (secções Args/Returns/Raises). O gate fica
# verde e estas regras são ligadas quando as docstrings forem normalizadas.
"moodle_mcp/server.py" = ["D205", "D212", "D400", "D401", "D413", "D301", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

# Os módulos sem dependência do servidor são verificados em modo estrito; o
# server.py (ferramentas MCP que devolvem o JSON do Moodle) fica no modo normal.
[[tool.mypy.overrides]]
module = [
  "moodle_mcp.config",
  "moodle_mcp.confirm",
  "moodle_mcp.login",
  "moodle_mcp.sanitize",
  "moodle_mcp.transport",
  "moodle_mcp.vault",
]
# Equivalente ao `strict` (que o mypy só aceita globalmente), por módulo.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
